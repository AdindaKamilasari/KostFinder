<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - KostFinder</title>

    <link rel="icon" href="assets/favicon.png">
    
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/register.css">
</head>
<body>

<div class="container">
    <!-- LEFT -->
    <div class="left">
        <img src="assets/hero_6.png" alt="Room Illustration">
    </div>

    <!-- RIGHT -->
    <div class="right">
        <a href="login.html" class="back">
            <img src="assets/back_arrow.png" alt="Kembali">
        </a>


        <div class="form-wrapper">
            <h1>Daftar KostFinder</h1>

            <form>
                <label>Nama Depan</label>
                <input type="text" id="nama_depan" placeholder="Masukkan nama depan">

                <label>Nama Belakang</label>
                <input type="text" id="nama_belakang" placeholder="Masukkan nama belakang">

                <label>Email</label>
                <input type="email" id="email" placeholder="Masukkan email">

                <label>Password</label>
                <input type="password" id="password" placeholder="Masukkan Password">

                <label>No. Hp</label>
                <input type="text" id="nomor_handphone" placeholder="Masukkan nomor HP">
            </form>

            <button id="submit" type="button">Daftar</button>
        </div>

    </div>
</div>

<div id="toast" class="toast"></div>

<script src="js/register.js"></script>

</body>
</html>
