<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - KostFinder</title>

    <link rel="icon" href="assets/favicon.png">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/change_password.css">
</head>
<body>

<div class="container">
    <!-- LEFT -->
    <div class="left">
        <img src="assets/hero_5.png" alt="Room Illustration">
    </div>

    <!-- RIGHT -->
    <div class="right">
        <a href="otp.html" class="back">
            <img src="assets/back_arrow.png" alt="Kembali">
        </a>


        <div class="form-wrapper">
            <h1>Ubah Password</h1>

            <p>Password baru akan kamu gunakan untuk akses ke akun KostFinder</p>

            <form>
                <label>Password Baru</label>
                <input type="password" id="password" placeholder="Masukkan password baru">

                <label>Ulangi Password baru</label>
                <input type="password" id="password_repeat" placeholder="Ulangi Password Baru">
            </form>

            <button id="submit" type="button">Simpan</button>
        </div>

    </div>
</div>

<div id="toast" class="toast"></div>

<script src="js/change_password.js"></script>

</body>
</html>
