<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - KostFinder</title>

    <link rel="icon" href="assets/favicon.png">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/forgot_password.css">
</head>
<body>

<div class="container">
    <!-- LEFT -->
    <div class="left">
        <img src="assets/hero_3.png" alt="Room Illustration">
    </div>

    <!-- RIGHT -->
    <div class="right">
        <a href="login.html" class="back">
            <img src="assets/back_arrow.png" alt="Kembali">
        </a>


        <div class="form-wrapper">
            <h1>Lupa Password</h1>

            <p>Masukkan nomor Handphone yang terdaftar di KostFinder, dan lakukan verifikasi untuk membuat password baru</p>

            <form>
                <label>Email / Nomor Handphone</label>
                <input type="text" id="email" placeholder="Masukkan sesuai yang kamu daftarkan">
                
            </form>

            <p>Kamu akan membuat password baru setelah verifikasi berhasil</p>

            <button id="submit" type="button">Kirim OTP</button>
        </div>

    </div>
</div>

<div id="toast" class="toast"></div>

<script src="js/forgot_password.js"></script>

</body>
</html>
